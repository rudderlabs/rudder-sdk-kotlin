name: Gradle Dependency Submission

on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - '**/gradle.lockfile'
      - '**/gradle/dependency-locks/**'
      - 'gradle/**'
      - 'gradlew*'
      - 'buildSrc/**'
      - '.github/gradle/verify-dependency-resolution.init.gradle'
      - '.github/workflows/dependency-submission.yml'
  pull_request:
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - '**/gradle.lockfile'
      - '**/gradle/dependency-locks/**'
      - 'gradle/**'
      - 'gradlew*'
      - 'buildSrc/**'
      - '.github/gradle/verify-dependency-resolution.init.gradle'
      - '.github/workflows/dependency-submission.yml'
  schedule:
    - cron: '23 6 * * 1' # Weekly refresh for dependencies with version ranges.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-dependency-graph:
    name: Generate dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep test/build dependencies in the graph, with development scope.
      DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: '.*[Rr]untimeClasspath'
      DEPENDENCY_GRAPH_RUNTIME_EXCLUDE_CONFIGURATIONS: '.*[Tt]est.*'
      DEPENDENCY_GRAPH_RUNTIME_EXCLUDE_PROJECTS: ':buildSrc.*'
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate and save dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: .
          # buildSrc is an implicit build, so resolve its test/runtime inputs explicitly.
          dependency-resolution-task: >-
            :ForceDependencyResolutionPlugin_resolveAllDependencies
            :buildSrc:ForceDependencyResolutionPlugin_resolveAllDependencies
          dependency-graph: generate-and-upload
          artifact-retention-days: 7
          cache-provider: basic
          validate-wrappers: true
          additional-arguments: >-
            --no-configuration-cache --no-configure-on-demand --no-daemon
            --init-script .github/gradle/verify-dependency-resolution.init.gradle

      - name: Check dependency inventory
        shell: python
        run: |
          import json
          from pathlib import Path

          reports = list(Path('dependency-graph-reports').rglob('*.json'))
          if not reports:
              raise SystemExit('No dependency graph snapshot was generated')
          packages = []
          for report in reports:
              snapshot = json.loads(report.read_text())
              for manifest in snapshot['manifests'].values():
                  packages.extend(manifest['resolved'].values())
          maven = [p for p in packages if p['package_url'].startswith('pkg:maven/')]
          if not maven:
              raise SystemExit('The dependency graph contains no Maven packages')
          if {p.get('relationship') for p in maven} != {'direct', 'indirect'}:
              raise SystemExit('Expected both direct and indirect Maven dependencies')
          if {p.get('scope') for p in maven} != {'runtime', 'development'}:
              raise SystemExit('Expected runtime and development dependency scopes')
          print(f'Validated {len(reports)} snapshots with {len(maven)} Maven entries')

  submit-dependency-graph:
    name: Submit dependency graph
    needs: generate-dependency-graph
    # Manual runs on other branches and all pull requests only generate artifacts.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      # Read artifacts from this successful run; no checkout or Gradle execution.
      - name: Download and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: download-and-submit
          cache-disabled: true
