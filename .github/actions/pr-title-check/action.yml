name: 'PR Title Check'
description: 'Validates PR title format using RudderLabs conventional commit standards'

runs:
  using: 'composite'
  steps:
    - name: Check PR title format
      uses: rudderlabs/github-action-check-pr-title@3967756a96b89133e6cd700a8384a1e2b95cb21c # v2.0.3
      with:
        # v1 rejected a subject that starts with a capital letter. Keep that rule.
        subjectPattern: ^(?![A-Z]).+$

    - name: PR Title Check Result
      shell: bash
      run: |
        echo "✅ PR title follows RudderLabs conventional commit standards"
        echo "PR title validation completed successfully"
